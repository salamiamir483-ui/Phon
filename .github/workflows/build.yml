name: Build APK from Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Zip
        run: |
          unzip -q PrivateSmsVault-v2.zip -d extracted_project
          ls -la extracted_project

      - name: Build Debug APK with Gradle
        run: |
          cd extracted_project/PrivateSmsVault
          chmod +x gradlew || true
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted_project/PrivateSmsVault/app/build/outputs/apk/debug/app-debug.apk
