

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Zip
        run: |
          unzip -q PrivateSmsVault-v2.zip -d extracted_project
          ls -la extracted_project

      - name: Find Project Root and Build
        run: |
          cd extracted_project
          # پیدا کردن پوشه‌ای که gradlew توش قرار داره
          PROJECT_DIR=$(find . -name "gradlew" -maxdepth 3 | xargs dirname)
          echo "Found project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        
